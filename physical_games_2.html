<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA 2026 | Physical Games Registration</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap');
    
    .font-gaming { font-family: 'Orbitron', sans-serif; }
    .font-subhead { font-family: 'Rajdhani', sans-serif; }
    
    .bg-cyber-dark { background-color: #07090e; }
    .bg-card-cyber { background: linear-gradient(145deg, #0e131f 0%, #141b2a 100%); }
    
    .cyan-glow-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .cyan-glow-btn:hover {
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .text-neon-cyan { color: #00f0ff; }
    .text-neon-pink { color: #ff007f; }
  </style>
</head>
<body class="bg-cyber-dark text-gray-200 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

  <!-- TOP NAV BAR -->
  <nav class="border-b border-cyan-900/50 bg-black/90 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="p-2 bg-cyan-950 border border-cyan-500/40 rounded-xl">
          <i data-lucide="crown" class="text-neon-cyan w-6 h-6"></i>
        </div>
        <div>
          <span class="font-gaming text-lg font-black text-white">AURA <span class="text-neon-pink">2026</span></span>
          <span class="text-[10px] font-mono text-cyan-400 block -mt-1">SPORTS ARENA</span>
        </div>
      </a>

      <div class="flex items-center space-x-3">
        <a href="admin_2.html" class="text-xs bg-cyan-950 border border-cyan-500/40 text-cyan-400 px-3 py-1.5 rounded-full hover:bg-cyan-900 transition flex items-center gap-1.5 font-mono">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin Portal
        </a>
      </div>
    </div>
  </nav>

  <!-- FORM CONTAINER -->
  <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow flex items-center justify-center">
    <div class="bg-card-cyber border border-cyan-900/50 p-6 sm:p-8 rounded-3xl w-full shadow-2xl space-y-6">
      
      <!-- Title Header -->
      <div class="text-center space-y-1">
        <div class="inline-flex items-center justify-center p-3 bg-cyan-950/60 border border-cyan-500/30 rounded-2xl mb-2">
          <i data-lucide="trophy" class="text-neon-cyan w-8 h-8"></i>
        </div>
        <h2 class="font-gaming text-xl sm:text-2xl font-black text-white tracking-wide">Physical Games Registration</h2>
        <p class="text-xs font-mono text-cyan-400/80">Register your team for the campus championship</p>
      </div>

      <form id="physicalGamesForm" class="space-y-4 font-mono text-xs">
        
        <!-- Game Selection -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Select Game *</label>
          <div class="relative">
            <select id="gameSelect" name="game" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 appearance-none">
              <option value="">-- Choose a Game --</option>
              <option value="Kabaddi">Kabaddi</option>
              <option value="Volleyball">Volleyball</option>
              <option value="Kho Kho">Kho Kho</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 absolute right-3 top-3.5 pointer-events-none"></i>
          </div>
        </div>

        <!-- Academic Year Selection -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Select Year *</label>
          <div class="relative">
            <select id="yearSelect" name="year" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 appearance-none">
              <option value="">-- Select Year --</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 absolute right-3 top-3.5 pointer-events-none"></i>
          </div>
        </div>

        <!-- Branch Selection -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Select Branch *</label>
          <div class="relative">
            <select id="branchSelect" name="branch" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 appearance-none">
              <option value="">-- Select Branch --</option>
              <option value="CSE">CSE</option>
              <option value="CSD">CSD</option>
              <option value="ECE">ECE</option>
              <option value="MECH">MECH</option>
              <option value="EEE">EEE</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 absolute right-3 top-3.5 pointer-events-none"></i>
          </div>
        </div>

        <!-- Team Name -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Team Name *</label>
          <div class="relative">
            <i data-lucide="shield" class="w-4 h-4 text-gray-500 absolute left-3 top-3.5"></i>
            <input type="text" id="teamName" name="teamName" placeholder="Enter your squad name" required class="w-full bg-black/60 border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
          </div>
        </div>

        <!-- Captain Name -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Captain Name *</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-gray-500 absolute left-3 top-3.5"></i>
            <input type="text" id="captainName" name="captainName" placeholder="Enter captain's full name" required class="w-full bg-black/60 border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
          </div>
        </div>

        <!-- Contact / Phone Number -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-1">Contact Phone Number *</label>
          <div class="relative">
            <i data-lucide="phone" class="w-4 h-4 text-gray-500 absolute left-3 top-3.5"></i>
            <input type="tel" id="captainPhone" name="captainPhone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required class="w-full bg-black/60 border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
          </div>
        </div>

        <!-- Team Roster / Players -->
        <div>
          <label class="block text-gray-300 font-bold uppercase mb-2">Squad Roster / Player Names *</label>
          <div id="membersContainer" class="space-y-2">
            <div class="flex items-center gap-2">
              <input type="text" name="members[]" placeholder="Player 1 Name (Captain)" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
            </div>
          </div>
          <button type="button" id="addMemberBtn" class="mt-3 w-full bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/40 text-cyan-400 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Add Team Member
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full cyan-glow-btn text-black font-gaming font-bold text-sm py-3.5 rounded-xl transition flex items-center justify-center gap-2 mt-4">
          <i data-lucide="send" class="w-4 h-4"></i> REGISTER TEAM
        </button>

      </form>
    </div>
  </main>

  <footer class="border-t border-gray-900 py-4 text-center text-xs text-gray-500 bg-black font-mono">
    <p>© 2026 JNTUH Mahabubabad Freshers Event Committee.</p>
  </footer>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_84IJ_nR-6R4R-lekxtlFPP32URJXm1U",
      authDomain: "jntuh-freshers.firebaseapp.com",
      projectId: "jntuh-freshers",
      storageBucket: "jntuh-freshers.firebasestorage.app",
      messagingSenderId: "485511130838",
      appId: "1:485511130838:web:712ae4c86628e3ce3f2377"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    const membersContainer = document.getElementById('membersContainer');
    const addMemberBtn = document.getElementById('addMemberBtn');
    const form = document.getElementById('physicalGamesForm');
    const submitBtn = document.getElementById('submitBtn');

    addMemberBtn.addEventListener('click', () => {
      const count = membersContainer.children.length + 1;
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `
        <input type="text" name="members[]" placeholder="Player ${count} Name" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
        <button type="button" onclick="this.parentElement.remove(); updatePlaceholders();" class="p-3 text-red-400 hover:text-red-300 bg-red-950/40 border border-red-900/50 rounded-xl">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      `;
      membersContainer.appendChild(div);
      lucide.createIcons();
    });

    window.updatePlaceholders = () => {
      const inputs = membersContainer.querySelectorAll('input[name="members[]"]');
      inputs.forEach((input, idx) => {
        input.placeholder = idx === 0 ? "Player 1 Name (Captain)" : `Player ${idx + 1} Name`;
      });
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "SAVING REGISTRATION...";

      const formData = new FormData(form);
      const membersList = formData.getAll('members[]').filter(m => m.trim() !== '');

      const payload = {
        game: formData.get('game'),
        year: formData.get('year'),
        branch: formData.get('branch'),
        teamName: formData.get('teamName'),
        captainName: formData.get('captainName'),
        captainPhone: formData.get('captainPhone'),
        members: membersList,
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "physical_teams"), payload);
        alert(`Team "${payload.teamName}" registered successfully for ${payload.game}!`);
        form.reset();
        membersContainer.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="text" name="members[]" placeholder="Player 1 Name (Captain)" required class="w-full bg-black/60 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400" />
          </div>
        `;
      } catch (err) {
        console.error("Firebase save error:", err);
        alert("Error saving registration to database: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> REGISTER TEAM`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
